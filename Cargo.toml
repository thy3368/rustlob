cargo-features = ["profile-rustflags"]

[workspace]
members = [
    # lib/common
    "lib/common/base_types",
    "lib/common/cmd_handler",
    "lib/common/db_repo",
    "lib/common/diff",
    "lib/common/entity",
    "lib/common/entity_derive",
    "lib/common/hotstuff_rs",
    "lib/common/id_generator",
    "lib/common/inbound_adapter_support",
    "lib/common/inbound_adapter_support_macros",
    "lib/common/lob_repo",
    # lib/core
    "lib/core/exchange/prep",
    "lib/core/l1",
    "lib/core/l1_adapter",
    # lib/example
    "lib/example/core",
    "lib/example/inbound_adapter",
    "lib/example/outbound_adapter",
    "lib/example/veldra_inbound_adapter",
    # app
    "inbound_adapter/axum_server",
    "app/client",
    "app/pingora_gateway",
    "inbound_adapter/websocket_sockudo",
    # proc
    "operating/cex/exchange/spot",
    "operating/cex/exchange/derivatives",
    "operating/cex/exchange/wallet",
    "operating/cex/exchange/spot_market_data",
    "operating/cex/push/push",
    # study
    "study/web3",
    "study/hyperliquid_analyzer",
    "lib/veldra/core",
    "lib/veldra/outbound_adapter",
    "lib/veldra/inbound_adapter",
]

# XDP/libbpf 依赖 Linux 内核头与 libelf，macOS 默认构建应跳过该 crate。
default-members = [
    # lib/common
    "lib/common/base_types",
    "lib/common/cmd_handler",
    "lib/common/db_repo",
    "lib/common/diff",
    "lib/common/entity",
    "lib/common/entity_derive",
    "lib/common/hotstuff_rs",
    "lib/common/id_generator",
    "lib/common/inbound_adapter_support",
    "lib/common/inbound_adapter_support_macros",
    "lib/common/lob_repo",
    # lib/core
    "lib/core/exchange/prep",
    "lib/core/l1",
    "lib/core/l1_adapter",
    # lib/example
    "lib/example/core",
    "lib/example/inbound_adapter",
    "lib/example/outbound_adapter",
    # app
    "inbound_adapter/axum_server",
    "app/client",
    "app/pingora_gateway",
    "inbound_adapter/websocket_sockudo",
    # proc
    "operating/cex/exchange/spot",
    "operating/cex/exchange/derivatives",
    "operating/cex/exchange/wallet",
    "operating/cex/exchange/spot_market_data",
    "operating/cex/push/push",
    # study
    "study/web3",
    "study/hyperliquid_analyzer",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hongyao Tang"]
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# 共享依赖可以在这里定义

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
target-cpu = "native"
# 启用 Apple Silicon 的向量扩展
rustflags = [
    "-Cllvm-args=--inline-threshold=500",
    "-Cllvm-args=--unroll-count=8"
]
