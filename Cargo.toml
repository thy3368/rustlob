cargo-features = ["profile-rustflags"]

[workspace]
members = [
    # lib/common
    "lib/common/base_types",
    "lib/common/cmd_handler",
    "lib/common/db_repo",
    "lib/common/diff",
    "lib/common/entity",
    "lib/common/entity_derive",
    "lib/common/hotstuff_rs",
    "lib/common/id_generator",
    "lib/common/inbound_adapter_support",
    "lib/common/inbound_adapter_support_macros",
    "lib/common/lob_repo",
    # lib/core
    "lib/core/exchange/prep",
    "lib/core/l1",
    "lib/core/l1_adapter",
    # lib/example
    "lib/example/core",
    "lib/example/inbound_adapter",
    "lib/example/outbound_adapter",
    "lib/example/veldra_inbound_adapter",
    # app
    "inbound_adapter/axum_server",
    "app/client",
    "app/pingora_gateway",
    "inbound_adapter/websocket_sockudo",
    # proc
    "operating/cex/exchange/spot",
    "operating/cex/exchange/derivatives",
    "operating/cex/exchange/wallet",
    "operating/cex/exchange/spot_market_data",
    "operating/cex/push/push",
    # study
    "study/web3",
    "study/hyperliquid_analyzer",
    "lib/veldra/core",
    "lib/veldra/outbound_adapter",
    "lib/veldra/inbound_adapter",
]

# XDP/libbpf 依赖 Linux 内核头与 libelf，macOS 默认构建应跳过该 crate。
default-members = [
    # lib/common
    "lib/common/base_types",
    "lib/common/cmd_handler",
    "lib/common/db_repo",
    "lib/common/diff",
    "lib/common/entity",
    "lib/common/entity_derive",
    "lib/common/hotstuff_rs",
    "lib/common/id_generator",
    "lib/common/inbound_adapter_support",
    "lib/common/inbound_adapter_support_macros",
    "lib/common/lob_repo",
    # lib/core
    "lib/core/exchange/prep",
    "lib/core/l1",
    "lib/core/l1_adapter",
    # lib/example
    "lib/example/core",
    "lib/example/inbound_adapter",
    "lib/example/outbound_adapter",
    # app
    "inbound_adapter/axum_server",
    "app/client",
    "app/pingora_gateway",
    "inbound_adapter/websocket_sockudo",
    # proc
    "operating/cex/exchange/spot",
    "operating/cex/exchange/derivatives",
    "operating/cex/exchange/wallet",
    "operating/cex/exchange/spot_market_data",
    "operating/cex/push/push",
    # study
    "study/web3",
    "study/hyperliquid_analyzer",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hongyao Tang"]
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
large_futures = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
result_large_err = "warn"
boxed_local = "warn"
box_collection = "warn"
redundant_allocation = "warn"
vec_init_then_push = "warn"
slow_vector_initialization = "warn"
unnecessary_to_owned = "warn"
redundant_clone = "warn"
iter_overeager_cloned = "warn"
needless_collect = "warn"
iter_over_hash_type = "warn"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_precision_loss = "deny"
float_cmp = "deny"
clone_on_ref_ptr = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
# 共享依赖可以在这里定义

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
target-cpu = "native"
# 启用 Apple Silicon 的向量扩展
rustflags = [
    "-Cllvm-args=--inline-threshold=500",
    "-Cllvm-args=--unroll-count=8"
]
