[package]
name = "hyperliquid_node"
version.workspace = true
edition.workspace = true
publish = false
description = "Deployment package for an official Hyperliquid non-validator node"

[dependencies]
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
