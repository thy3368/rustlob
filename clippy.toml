# 严禁生产路径出现逃逸式控制流与调试输出
disallowed-methods = [
    "std::option::Option::unwrap",
    "std::result::Result::unwrap",
    "std::result::Result::expect",
]

# 补充约束：禁止直接依赖 panic 运行时类型
disallowed-types = [
    "core::panic::PanicInfo",
]

# `PanicInfo` 不能拦住 `panic!`，这里直接禁用相关宏
disallowed-macros = [
    "std::dbg",
    "std::eprintln",
    "std::panic",
    "std::println",
    "std::todo",
    "std::unimplemented",
    "core::panic",
    "core::todo",
    "core::unimplemented",
]

# 测试代码允许使用调试性写法，生产代码仍按上面的硬禁项执行
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
