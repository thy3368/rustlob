[package]
name = "l1_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alloy-primitives = "0.8"
cmd_handler = { path = "../../common/cmd_handler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"


[dev-dependencies]
proptest = "1.6"
prusti-contracts = "0.1.6"
trybuild = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[package.metadata.kani.flags]
tests = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
