[package]
name = "raft_use_case_demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
base_types_v2 = { path = "../../common/base_types_v2" }
common_entity = { package = "entity", path = "../../common/entity" }
example_core_use_case = { path = "../use_case" }
example_outbound_adapter = { path = "../outbound_adapter" }
lob_repo_v2 = { path = "../../common/lob_repo_v2" }
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2", "single-term-leader"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
use_case_executor = { path = "../use_case_executor" }

[lints]
workspace = true
