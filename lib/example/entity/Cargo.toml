[package]
name = "example_core_entity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
common_entity = { package = "entity", path = "../../common/entity" }
base_types = { path = "../../common/base_types", features = ["serde"] }
