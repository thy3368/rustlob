[package]
name = "example_outbound_adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
test-support = []

[dependencies]
common_entity = { package = "entity", path = "../../common/entity" }
base_types_v2 = { path = "../../common/base_types_v2" }
example_core_use_case = { path = "../use_case" }
example_core_entity = { path = "../entity" }
lob_repo_v2 = { path = "../../common/lob_repo_v2" }
mysql = "24.0"
thiserror = "1"
openraft = { version = "0.9.21", default-features = false, features = ["serde", "storage-v2"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rocksdb = "0.19"
rust_decimal = "1.41"

[lints]
workspace = true
