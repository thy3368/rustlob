[package]
name = "push"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
io-uring = []

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
base_types = { path = "../../../../lib/common/base_types" }
chrono = "0.4.43"
# Database repository
db_repo = { path = "../../../../lib/common/db_repo" }
serde_json = "1.0.149"
rand = "0.9.2"
entity_derive = { path = "../../../../lib/common/entity_derive" }
diff = { path = "../../../../lib/common/diff" }
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"
prefetch = "0.2.0"
rayon = "1.10.0"
once_cell = "1.21.3"
serde = { version = "1.0.203", features = ["derive"] }
bytes = "1.5.0"
actix = "0.13.5"
actix-rt = "2.11.0"
core_affinity = "0.8.1"
num_cpus = "1.16.0"
thiserror = "1.0.60"
# 移除spot_behavior依赖，因为用户不想依赖它

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "kline_benchmark"
harness = false

[[bench]]
name = "kline_benchmark_high_freq"
harness = false

[[bench]]
name = "single_thread_kline_benchmark"
harness = false
